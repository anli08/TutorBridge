<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · TutorBridge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topnav">
  <div class="topnav-inner">
    <a href="home.html" class="logo">
      <svg width="40" height="40" viewBox="0 0 200 200" role="img" aria-label="TutorBridge">
        <rect x="20" y="20" width="160" height="160" rx="28" fill="#A7C1C5"/>
        <path d="M60,120 Q100,60 140,120" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
        <line x1="50" y1="120" x2="150" y2="120" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="80" y1="95" x2="80" y2="120" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="120" y1="95" x2="120" y2="120" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      </svg>
    </a>   
    <div class="search-wrap">
      <input type="search" class="search-input" placeholder="Search" onkeydown="if(event.key==='Enter')window.location.href='search-results.html'">
    </div>
    <nav class="nav-links">
      <a href="messages.html">Messages</a>
      <a href="mytutors.html" id = "my-tutors-link">My Tutors</a>
      <a href="settings.html" class="active">Settings</a>
      <a href="#" class="bell-btn" aria-label="Notifications" onclick="return false;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
        <span class="bell-dot"></span>
      </a>    
    </nav>
  </div>
</header>

<main class="shell">
  <div class="two-col right-rail">

    <div class="panel profile-card settings-card">
      <div class="cover">
        <div class="avatar lg"></div>
      </div>
      <a class="btn btn-primary" id="edit-login-link" href="editLogin.html">Change Username/Password</a>
      

      <form id="settings-form">
        <div class="text-block">
          <label for="description">Description:</label>
          <textarea id="description" placeholder="…"></textarea>
        </div>

        <div class="field">
          <label for="rate">Preferred Rate / Rate Per Hour</label>
          <input type="number" id="rate" min="0" step="0.01" required>
        </div>

        <div class="field location-field">
          <label for="address">Location</label>
          <div class="location-controls">
            <input type="text" id="address" placeholder="No location set" readonly>
            <button type="button" class="btn" id="use-location">Use my current location</button>
          </div>
          <p class="field-hint" id="location-status" role="status" aria-live="polite">
            Your location is optional and is only used to help match you with nearby users. Only an approximate location (about 1 km) is saved.
          </p>
          <input type="hidden" id="latitude">
          <input type="hidden" id="longitude">
        </div>

        <div class="field">
          <label for="tutor-type">Tutoring Type</label>
          <select id="tutor-type">
            <option value="online">Online</option>
            <option value="in-person">In Person</option>
          </select>
        </div>

        <div class="field" role="group" aria-labelledby="subjects-heading">
          <label id="subjects-heading">Subject(s)</label>
          <div class="chip-group" id="subjects">
            <label class="chip"><input type="checkbox" value="math"><span>Math</span></label>
            <label class="chip"><input type="checkbox" value="english"><span>English</span></label>
            <label class="chip"><input type="checkbox" value="science"><span>Science</span></label>
            <label class="chip"><input type="checkbox" value="history"><span>History</span></label>
          </div>
        </div>

        <div class="text-block" style="border-top: none; display:flex; align-items:center; gap:14px;">
          <button type="submit" id="submit-btn" class="btn btn-primary">Save Changes</button>
          <span id="save-note" style="opacity:0; color:var(--text); font-weight:600; font-size:13.5px; transition:opacity .2s;">Saved.</span>
        </div>
      </form>
    </div>    
  </div>
</main>

<script src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
