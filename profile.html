<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · TutorBridge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topnav">
  <div class="topnav-inner">
    <a href="home.html" class="logo">
      <svg width="40" height="40" viewBox="0 0 200 200" role="img" aria-label="TutorBridge">
        <rect x="20" y="20" width="160" height="160" rx="28" fill="#A7C1C5"/>
        <path d="M60,120 Q100,60 140,120" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
        <line x1="50" y1="120" x2="150" y2="120" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="80" y1="95" x2="80" y2="120" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="120" y1="95" x2="120" y2="120" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      </svg>
    </a>   
    <div class="search-wrap">
      <input type="search" class="search-input" placeholder="Search Users"
             onkeydown="if(event.key==='Enter')window.location.href='search-results.html'">
    </div>
    <nav class="nav-links">
      <a href="messages.html">Messages</a>
      <a href="mytutors.html" id = "my-tutors-link">My Tutors</a>
      <a href="settings.html">Settings</a>
<a href="#" class="bell-btn" aria-label="Notifications" onclick="return false;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
      <span class="bell-dot">
      </span></a>    </nav>
  </div>
</header>

<main class="shell">
  <div class="two-col right-rail">

    <!-- profile -->
    <div class="panel profile-card">
      <div class="cover">
        <div class="avatar lg" id="profile-avatar"></div>
        <div class="name" id="profile-name"></div>
      </div>
      <div class="body">
        <div id="profile-stars" class="profile-stars"></div>
        <p id="profile-details" class="row-meta"></p>
        <h3>Description</h3>
        <p id="profile-description"></p>
        <h3 id = "displayed-subject"></h3>
        <p id = "profile-subject"></p>
        <h3 id = "displayed-rate"></h3>
        <p id = "profile-rate"></p>
        <h3 id = "displayed-mode"></h3>
        <p id = "profile-mode"></p>
        <form class="preference-form" id="rating-form">
         <div class="field">
            <h2><label for="user-rating">Rate User</label></h2>
            <select id="user-rating">
                <option value="" disabled selected>Select…</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
            <button type="submit" class="btn btn-primary" id="rating-submit">Submit</button>
            <p class="field-hint" id="rating-status" role="status" aria-live="polite"></p>
          </div>
        </form>

        <div style="display:flex; gap:10px; margin-top:22px;">
          <a href="messages.html" class="btn btn-primary" id="message-btn">Message</a>
          <a href="mytutors.html" class="btn" id="add-to-list-btn">Add to My Tutors</a>
        </div>
      </div>
    </div>

    <!-- recommended -->
    <div class="panel">
      <div class="panel-head"><h2>Recommended</h2></div>
      <div class="row-list" id = "recommended-list"></div>
    </div>

  </div>
</main>

<script src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
